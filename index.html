<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Logic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Animal Logic</h1>
  <div id="scorebar">
    <span>Templates used: <b id="score">0</b></span>
    <span>Par: <b id="par">…</b></span>
    <button id="newdeal">New deal</button>
  </div>
</header>

<section>
  <h2>Your hand <small id="swaphint">— you may swap one card</small></h2>
  <div id="hand" class="cards big"></div>
</section>

<section>
  <h2>Describe exactly these animals</h2>
  <div id="sentence"><span class="lead">These animals are</span><div id="workspace"></div><span class="lead">.</span></div>
  <div id="status"></div>
  <div id="toolbar">
    <div id="trash" title="Drop here to delete">🗑 drop to delete</div>
    <button id="clear">Clear</button>
  </div>
</section>

<section>
  <h2>Pieces</h2>
  <div id="palette"></div>
</section>

<section>
  <h2>The rest of the pool</h2>
  <div id="pool" class="cards small"></div>
</section>

<script src="animals.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
